# PaperTracker runtime defaults.
#
# This file is tracked in git and is meant to stay topic-neutral. Your own
# research topics belong in `user_data/projects.toml` — see projects.example.toml.
# CLI flags and PAPERTRACKER_* environment variables override anything here.

# Summarization provider. "claude" or "codex" — whichever CLI you logged into.
provider = "claude"
claude_model = "sonnet"
codex_model = "gpt-5.6-luna"

# How hard the model thinks per summary. One shared scale for both providers:
# "low", "medium", "high", "xhigh", or "max" — the value is passed through
# verbatim as `claude --effort <level>` or `codex -c model_reasoning_effort=`.
# Higher levels cost more quota and take longer. Set it to "default" to pass
# nothing and let each CLI apply its own.
reasoning_effort = "medium"

# Crossref / OpenAlex polite-pool identifier.
# Leave empty for anonymous requests, or set PAPERTRACKER_EMAIL in your shell.
user_email = ""
user_agent_name = "papertracker/0.1"

# Local relevance filter. Each paper's (title + abstract) is embedded and compared
# to the active profile's topic_statement by cosine similarity. Nothing leaves
# your machine and no LLM quota is spent.
embedding_model = "BAAI/bge-small-en-v1.5"
relevance_scorer = "dense"
relevance_threshold = 0.65
hybrid_relevance_threshold = 0.60
enable_reranker = false
reranker_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
reranker_top_k = 100

# Placeholder topic, used only when no user_data/projects.toml exists.
# Replace it there, not here.
topic_statement = """
Describe your research topic here, in a few sentences. The longer and more
specific this is, the better PaperTracker can tell relevant papers from noise.
Set this per project in user_data/projects.toml.
"""
crossref_query_hint = "replace with keywords describing your topic"

# Paper sources.
arxiv_categories = ["cs.AI"]
enabled_sources_default = ["arxiv", "ieee", "acm", "journal_rss"]
priority_venue_only = false

# Run and output defaults. Relative output paths resolve under user_data/.
default_days = 2
max_results_per_query = 1500
digest_dir = "digests"
seen_papers_file = "state/seen.json"
summary_cache_file = "state/summary_cache.json"
summary_timeout_sec = 180

# Zotero integration.
zotero_data_dir = "~/Zotero"
zotero_linked_base = ""

# User-owned Markdown summary skeletons. Relative paths resolve under user_data/.
summary_template_dir = "summary_templates"
default_abstract_template = "abstract-screen"
default_fulltext_template = "deep-technical"

# Venues to badge with ★ in the digest, optionally poll by RSS, and optionally
# restrict output to via --priority-venues-only. Define your own once at the top
# level of user_data/projects.toml and every profile inherits them, or per
# profile to override. Example:
#
#   [[priority_venues]]
#   name = "ACM CHI"
#   publisher = "acm"                 # "acm" or "ieee"
#   patterns = ["CHI Conference on Human Factors", "CHI '"]
#
#   [[priority_venues]]
#   name = "IEEE TVCG"
#   publisher = "ieee"
#   patterns = ["Transactions on Visualization and Computer Graphics"]
#   rss = "https://ieeexplore.ieee.org/rss/TOC2945.XML"   # optional
priority_venues = []
