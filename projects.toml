# PaperTracker project profiles.
# Global runtime settings stay in papertracker.toml.

default_project = "xr-agents"

[[projects]]
id = "xr-agents"
name = "XR embodied agents"
topic_statement = """
Multi-modal embodied agents perceiving, reasoning about, and acting within 3D environments - including extended reality (XR), augmented reality (AR), and virtual reality (VR). Relevant topics include: vision-language models for embodied AI, 3D scene understanding, spatial reasoning over rooms and scenes, immersive interaction and mixed-reality interfaces, simulated agents in virtual worlds, embodied question answering, robot learning with multi-modal sensors, scene graphs and neural rendering for embodied perception, world models for navigation and manipulation, spatial interaction and spatial awareness in immersive environments, 3D avatars, and gaze/gesture interaction in XR.
"""
crossref_query_hint = "embodied agent multimodal 3D XR VR AR spatial scene understanding interaction awareness avatar"
arxiv_categories = ["cs.CV", "cs.RO", "cs.AI", "cs.HC", "cs.GR"]
relevance_threshold = 0.65

[[projects]]
id = "opinion-stance-formation"
name = "Opinion-to-stance spatial formation"
topic_statement = """
Investigate how multiple agents can transform expressed opinions into stances, and then use those stances to compute meaningful spatial formations, gestures, and interaction patterns. Given an agent's opinion, the system first infers or assigns its stance, then generates a spatial formation that visually communicates that stance in a multi-agent setting. The project also evaluates whether the resulting spatial formation carries the intended social meaning, such as agreement, disagreement, neutrality, support, opposition, alliance, distance, or conflict. Observers or models can also be asked to infer stance from the generated spatial formation, gesture, and interaction behavior to check whether the formation successfully communicates the intended meaning.
"""
crossref_query_hint = "opinion modeling stance inference spatial formation generation multi-agent systems spatial interaction gesture social meaning nonverbal communication formation evaluation human-agent interaction collective behavior"
arxiv_categories = ["cs.AI", "cs.HC", "cs.RO", "cs.MA", "cs.CL"]
relevance_threshold = 0.65

[[projects]]
id = "social-intention-spatial-reasoning"
name = "Social intention spatial reasoning"
topic_statement = """
Study how an agent can understand user intention in social contexts by interpreting motion, gesture, spatial awareness, and spatial reasoning. This project focuses on socially situated intentions, such as whether a user wants to approach, avoid, join, interrupt, collaborate, refuse, invite interaction, signal agreement, show hesitation, or claim personal space. The agent should reason about the user's movement and gesture together with spatial context, including distance, orientation, group arrangement, shared attention, obstacles, and the positions of other agents or people. The project also reviews existing work that has used agents, embodied agents, virtual agents, robots, or multi-agent systems to interpret user intention from motion, gesture, and social-spatial context, with the goal of identifying what social intentions have already been modeled, what sensing or reasoning methods were used, and where there are gaps for building more socially aware agents.
"""
crossref_query_hint = "social intention recognition gesture recognition motion understanding spatial awareness spatial reasoning proxemics agent-based interaction embodied agents virtual agents social robots multi-agent systems human-agent interaction social context behavioral signals intent prediction"
arxiv_categories = ["cs.HC", "cs.RO", "cs.AI", "cs.CV", "cs.MA"]
relevance_threshold = 0.65
