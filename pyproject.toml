[project]
name = "papertracker"
version = "0.1.0"
description = "Daily markdown digest of new papers matching your research topics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "feedparser>=6.0",
    "pypdf>=5.0",
    "python-dateutil>=2.9",
    "requests>=2.32",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=5"]

[project.scripts]
papertracker = "papertracker.bootstrap:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
