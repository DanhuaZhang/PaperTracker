name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # PaperTracker is developed on macOS but is meant to run anywhere uv does.
    # Windows is in the matrix because its failures are the ones that never
    # reproduce locally: path separators, cp1252 consoles, and CRLF checkouts.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # astral-sh publishes moving major tags only up to v7; newer releases are
      # exact tags, so @v9 does not resolve. Pin the release.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv build
